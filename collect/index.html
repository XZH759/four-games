<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>collect · AI 素养测评</title>
  <meta name="description" content="角色登录旅程中的 AI 素养测评答题（ailit_assessment 题库 · collect 养成壳）。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/collect/collect.css" />
</head>
<body class="collect-page">
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/nuannuan/map">
      <img src="/assets/bot-buddy.png" width="36" height="36" alt="" />
      <span>AI知识之旅 · 答题</span>
    </a>
    <p class="top-note" id="level-chip">collect</p>
  </header>

  <p class="boot-error" id="boot-error" hidden></p>

  <main class="assess" id="assess">
    <div class="assess-frame">
      <div class="assess-toolbar">
        <button type="button" class="linkish" id="btn-exit">← 返回地图</button>
        <span class="assess-meta" id="assess-meta"></span>
      </div>

      <aside class="companion-rail" id="companion-rail" hidden>
        <img id="companion-portrait" alt="" width="56" height="56" />
        <p id="companion-encourage">我在旁边陪你。慢慢想，提交就能继续前进。</p>
      </aside>

      <div class="shell-bar" id="shell-bar" aria-live="polite"></div>
      <div class="item-root" id="item-root"></div>

      <div class="assess-actions">
        <p class="neutral-copy">提交即接通 · 与对错无关</p>
        <button type="button" class="primary" id="btn-submit" disabled>提交并继续</button>
      </div>
    </div>
  </main>

  <div class="between-host" id="between-host" aria-live="polite"></div>

  <section class="end-screen" id="end-screen" hidden>
    <div class="end-card">
      <img src="/assets/bot-buddy.png" width="72" height="72" alt="" />
      <h1>本题已接通</h1>
      <p id="end-summary">正在返回地图…</p>
      <a class="primary" id="btn-back-map" href="/nuannuan/map">返回地图</a>
    </div>
  </section>

  <script src="/js/item-renderer.js"></script>
  <script src="/js/shells.js"></script>
  <script type="module" src="/collect/collect.js"></script>
</body>
</html>
